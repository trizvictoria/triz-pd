@keyframes tp-pulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 34, 51, 0.55); }
  70% { box-shadow: 0 0 0 28px rgba(0, 34, 51, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 34, 51, 0); }
}

@keyframes tp-nudge {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(8px); }
}

@keyframes tp-spin {
  to { transform: rotate(360deg); }
}

.tp-cta {
  animation: tp-pulse 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  transition: background 0.2s, transform 0.2s;
}

.tp-cta:hover { background: #003347 !important; transform: scale(1.02); }
.tp-cta:active { transform: scale(0.98); }
.tp-cta:focus-visible { outline: 4px solid #ffffff; outline-offset: 4px; }
.tp-arrow { animation: tp-nudge 1.4s ease-in-out infinite; }
.tp-ring { animation: tp-spin 40s linear infinite; transform-origin: 50% 50%; }

@media (prefers-reduced-motion: reduce) {
  .tp-cta, .tp-arrow, .tp-ring { animation: none; }
}

html.is-totem-gate,
html.is-totem-gate body,
html.is-totem-gate #root {
  height: 100%;
  overflow: hidden;
}

html.is-totem-gate #root { padding-top: 0; }

.gate {
  position: fixed;
  inset: 0;
  z-index: 13000;
  overflow: hidden;
  background: #001927;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
}

.totem-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #001927;
}

.totem-canvas-wrap {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1920px;
  height: 1080px;
  transform-origin: center center;
}

.totem-canvas-wrap[hidden],
.totem-compact[hidden] { display: none !important; }

.totem-compact {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 18px 18px;
  background: #001927;
  color: #fff;
  transform-origin: top left;
}

.tc-top,
.tc-brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 0;
}

.tc-brand { justify-content: flex-start; gap: 8px; }
.tc-brand img { height: clamp(22px, 4.2dvh, 36px); width: auto; }
.tc-brand strong { font-size: clamp(18px, 3.2dvh, 28px); font-weight: 700; }

.tc-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: clamp(28px, 4.4dvh, 40px);
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid #2e556b;
  font-weight: 700;
  font-size: clamp(11px, 1.6dvh, 14px);
  white-space: nowrap;
}

.tc-live i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #00f2c9;
}

.tc-badge {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  height: clamp(26px, 4dvh, 36px);
  padding: 0 12px;
  border-radius: 999px;
  background: #00dbff;
  color: #002233;
  font-weight: 800;
  font-size: clamp(12px, 1.8dvh, 16px);
}

.tc-title {
  margin: 0;
  font-weight: 900;
  font-size: clamp(32px, 6.4dvh, 64px);
  line-height: 0.92;
  letter-spacing: -0.04em;
}

.tc-title span { color: #00dbff; }

.tc-lead {
  margin: 0;
  font-weight: 600;
  font-size: clamp(13px, 2dvh, 18px);
  line-height: 1.25;
  color: #ffffffd9;
}

.tc-lead em { color: #00f2c9; font-style: normal; font-weight: 800; }

.tc-main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 0.9fr);
  gap: 1.4dvh 2vw;
}

.tc-steps {
  min-height: 0;
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 0.8dvh;
}

.tc-step {
  min-height: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0.6dvh 10px;
  border-radius: 14px;
  background: #002233;
  border: 1px solid #0e3a52;
  overflow: hidden;
}

.tc-step b {
  flex: none;
  width: clamp(28px, 4.6dvh, 40px);
  height: clamp(28px, 4.6dvh, 40px);
  border-radius: 10px;
  background: #00dbff;
  color: #002233;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(14px, 2.2dvh, 20px);
}

.tc-step strong { display: block; font-size: clamp(13px, 2dvh, 16px); }
.tc-step p {
  margin: 0;
  color: #ffffffcc;
  font-size: clamp(11px, 1.6dvh, 13px);
  line-height: 1.25;
}

.tc-panel {
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 0.8dvh;
  padding: 1.4dvh 12px;
  border-radius: 22px;
  background: #00dbff;
  color: #002233;
  overflow: hidden;
}

.tc-21 {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  font-weight: 900;
  font-size: clamp(56px, 10dvh, 96px);
  line-height: 0.8;
  letter-spacing: -0.05em;
}

.tc-21 small {
  padding-bottom: 4px;
  font-weight: 800;
  font-size: clamp(13px, 2dvh, 18px);
  line-height: 1.15;
}

.tc-panel p { margin: 0; font-weight: 700; font-size: clamp(12px, 1.7dvh, 15px); line-height: 1.25; }

.tc-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.tc-meta div {
  min-width: 0;
  padding: 8px;
  border-radius: 12px;
  background: #002233;
  color: #fff;
}

.tc-meta div:last-child { background: #fff; color: #002233; }
.tc-meta span { display: block; font-size: 11px; font-weight: 700; color: #00dbff; }
.tc-meta div:last-child span { color: #0077b2; }
.tc-meta strong { display: block; font-size: clamp(12px, 1.8dvh, 16px); line-height: 1.2; }

.tc-cta {
  display: flex;
  align-items: center;

async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function decryptSlice(bytes,password){
  const salt=bytes.slice(0,16);
  const iv=bytes.slice(16,28);
  const data=bytes.slice(28);
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data));
}
async function decrypt(buf,password){
  const bytes=new Uint8Array(buf);
  if(bytes[0]===80&&bytes[1]===68&&bytes[2]===50){
    const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
    let off=4;
    let last;
    while(off+4<=bytes.length){
      const len=view.getUint32(off); off+=4;
      const slice=bytes.slice(off,off+len); off+=len;
      try{return await decryptSlice(slice,password)}catch(err){last=err}
    }
    throw last||new Error('decrypt');
  }
  return decryptSlice(bytes,password);
}

function bindSuri(){
  const root=document.querySelector('.suri');
  if(!root) return;
  root.querySelectorAll('[data-suri-play]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const video=btn.parentElement&&btn.parentElement.querySelector('video');
      if(!video) return;
      video.controls=true;
      const played=video.play();
      btn.hidden=true;
      video.onended=()=>{btn.hidden=false;video.controls=false;video.currentTime=0};
      if(played&&played.catch) played.catch(()=>{btn.hidden=false});
    });
  });
  const scroller=document.querySelector('.content');
  const fill=root.querySelector('.suri-rail__fill');
  const stories=root.querySelector('.suri-stories');
  const nextDot=root.querySelector('.suri-rail__dot--next');
  const nextMark=root.querySelector('[data-suri-mark="assistida"]');
  if(!scroller||!fill||!stories) return;
  const sync=()=>{
    const max=scroller.scrollHeight-scroller.clientHeight;
    const progress=max<=8?1:Math.min(1,Math.max(0,scroller.scrollTop/max));
    fill.style.height=(progress*100)+'%';
    if(nextDot&&nextMark&&nextDot.parentElement){
      const rail=nextDot.parentElement;
      const top=nextMark.getBoundingClientRect().top-rail.getBoundingClientRect().top;
      nextDot.style.top=Math.max(0,top)+'px';
      nextDot.classList.toggle('is-on', rail.clientHeight>0 && progress>=top/rail.clientHeight);
    }
  };
  sync();
  scroller.addEventListener('scroll',sync,{passive:true});
  window.addEventListener('resize',sync);
}

function fitTotem(){
  const stage=document.querySelector('.totem-stage');
  if(!stage) return;
  const wrap=stage.querySelector('.totem-canvas-wrap');
  const compact=stage.querySelector('.totem-compact');
  if(!wrap||!compact) return;
  const scale=Math.min(stage.clientWidth/1920, stage.clientHeight/1080);
  const useCompact=scale<0.58;
  wrap.hidden=useCompact;
  compact.hidden=!useCompact;
  if(!useCompact){wrap.style.transform=`translate(-50%, -50%) scale(${scale})`;return}
  compact.style.transform='none';
  compact.style.width=stage.clientWidth+'px';
  const fit=Math.min(1, stage.clientHeight/compact.scrollHeight, stage.clientWidth/compact.scrollWidth);
  compact.style.transform=`scale(${fit})`;
}
