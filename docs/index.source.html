<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negociação · RD Station CRM</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800;9..40,900&family=Inter:wght@400;500;600&family=Nunito+Sans:wght@400;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0&display=swap" rel="stylesheet" />
  <style>
    :root{--color-nav-bg:#001927;--font:'DM Sans',sans-serif;--font-crm:'Nunito Sans','DM Sans',sans-serif;--primary-border:#00dbff;--primary-icon:#0077b2;--primary-icon-hover:#005580;--primary-icon-on-color:#00dbff;--primary-icon-on-color-hover:#66e9ff;--primary-surface-high-emphasis:#00dbff;--primary-surface-low-emphasis:#b2f4ff;--primary-surface-hover:#66ebff;--primary-text:#0077b2;--primary-text-hover:#005580;--primary-text-on-color:#00dbff;--primary-text-on-color-hover:#66e9ff;--neutral-border:#d6dbde;--neutral-border-interactive:#b2bcc1;--neutral-icon-high-emphasis:#002233;--neutral-icon-low-emphasis:#596b7a;--neutral-icon-disabled:#8c98a3;--neutral-icon-inverse:#fff;--neutral-surface:#fff;--neutral-surface-high-emphasis:#e5e8ea;--neutral-surface-low-emphasis:#eceeef;--neutral-surface-hover:#dadee0;--neutral-surface-disabled:#edeff1;--neutral-surface-inverse:#002233;--neutral-surface-inverse-interactive:#002233;--neutral-surface-inverse-interactive-hover:#003347;--neutral-text-high-emphasis:#002233;--neutral-text-low-emphasis:#405466;--neutral-text-disabled:#7f8d99;--neutral-text-inverse:#fff;--neutral-focus-outline:#00dbff;--danger-text:#c20046;--success-icon:#087a3a;--success-text:#087a3a;--success-border:#0ed869;--success-surface-low-emphasis:#d6fae8;--highlight-text:#6e00c5;--highlight-surface-low-emphasis:#edd6ff;--support-mint:#00f2c9;--size-spacing-01:4px;--size-spacing-02:8px;--size-spacing-03:12px;--size-spacing-04:16px;--size-spacing-05:24px;--size-spacing-06:32px;--size-spacing-07:40px;--border-radius-xs:4px;--border-radius-sm:8px;--border-radius-md:12px;--border-radius-lg:16px;--border-radius-pill:999px;--shadow-xs:0 2px 6px rgba(0,34,51,.1);--shadow-md:0 8px 18px rgba(0,34,51,.16);--shadow-lg:0 12px 24px rgba(0,34,51,.2);--zindex-3:1020;--zindex-4:1030;--zindex-6:1050;--motion-duration-extra-fast:100ms;--motion-duration-normal:300ms;--motion-timing-function-ease-out:cubic-bezier(.215,.61,.355,1);--motion-timing-function-ease-in-out:cubic-bezier(.645,.045,.355,1);--text-xl:800 28px/36px var(--font);--text-lg:500 20px/30px var(--font);--text-lg-bold:700 20px/30px var(--font);--text-md:500 16px/24px var(--font);--text-md-bold:700 16px/24px var(--font);--text-sm:500 14px/20px var(--font);--text-sm-bold:700 14px/20px var(--font);--text-xs:500 12px/16px var(--font)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none!important}
    html,body{height:100%}
    body{display:flex;flex-direction:column;padding-top:28px;font-family:var(--font);color:var(--neutral-text-high-emphasis);background:var(--color-nav-bg);-webkit-font-smoothing:antialiased}
    button,input,select{font-family:inherit}button{cursor:pointer;border:none;background:none}
    .demo-banner{position:fixed;top:0;left:0;right:0;z-index:12000;width:100%;height:28px;display:flex;align-items:center;justify-content:center;background:#00dbff;color:#002233;font:700 12px/16px var(--font);letter-spacing:.01em;flex-shrink:0}
    .layout{display:grid;grid-template-rows:64px 1fr;grid-template-columns:64px 1fr;grid-template-areas:"navbar navbar" "sidebar content";flex:1;min-height:0;height:auto;overflow:hidden}
    .navbar{grid-area:navbar;background:var(--color-nav-bg);display:flex;align-items:center;justify-content:space-between;padding:var(--size-spacing-03);height:64px;z-index:9600}
    .navbar img{max-width:none;display:block}
    .navbar-product{display:flex;align-items:center;height:40px;padding-left:8px}
    .navbar-logo{display:flex;align-items:center;gap:12px}
    .navbar-rds{position:relative;width:107px;height:32px;flex-shrink:0}
    .navbar-rds-symbol{position:absolute;left:0;top:0}
    .navbar-rds-lettering{position:absolute;inset:9.38% 0 9.38% 41.12%}
    .navbar-rds-line{position:absolute;inset:0 96.83% 0 0;background:rgba(0,219,255,.25)}
    .navbar-crm-word{position:absolute;left:23.81%;top:21.12%}
    .navbar-product-item{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0}
    .product-switch{position:relative;display:flex;align-items:center}
    .product-switch__toggle{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#fff;flex-shrink:0}
    .product-switch--light .product-switch__toggle{color:#111}
    .product-switch__toggle:hover,.product-switch__toggle[aria-expanded='true']{background:rgba(255,255,255,.08)}
    .product-switch--light .product-switch__toggle:hover,.product-switch--light .product-switch__toggle[aria-expanded='true']{background:#f3f3f3}
    .product-switch__menu{position:absolute;top:calc(100% + 8px);left:0;min-width:280px;padding:12px 0;background:#001927;border-radius:8px;box-shadow:0 12px 24px rgba(0,34,51,.28);z-index:9700}
    .product-switch__label{padding:4px 16px 8px;color:rgba(255,255,255,.55);font:700 11px/14px var(--font);letter-spacing:.08em;text-transform:uppercase}
    .product-switch__item{display:block;width:100%;padding:8px 16px;color:#fff;font:500 14px/20px var(--font);text-align:left}
    .product-switch__item:hover:not(:disabled){background:rgba(255,255,255,.08)}
    .product-switch__item.is-disabled,.product-switch__item:disabled{color:rgba(255,255,255,.42);cursor:default}
    .product-switch__sep{display:block;height:1px;margin:8px 12px;background:rgba(255,255,255,.12)}
    .navbar-secondary{display:flex;align-items:center;gap:8px}
    .navbar-icons{display:flex;align-items:center}
    .navbar-icon-btn{width:40px;height:40px;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#fff;position:relative;flex-shrink:0}
    .navbar-icon-btn:hover,.navbar-product-item:hover,.account-menu:hover,.sidebar-item-inner:hover{background:rgba(255,255,255,.08)}
    .badge-dot{position:absolute;top:4px;left:28px;width:8px;height:8px;background:#e60f57;border-radius:8px}
    .navbar-divider{width:1px;height:32px;background:#2e556b;border-radius:999px;flex-shrink:0}
    .account-menu{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;max-width:240px}
    .account-avatar{width:24px;height:24px;border-radius:8px;background:var(--support-mint);overflow:hidden;position:relative;flex-shrink:0}
    .account-avatar img{position:absolute;left:14.06%;top:4px;width:112.5%;aspect-ratio:40/41;height:auto}
    .account-name{color:#fff;font-family:var(--font);font-size:14px;font-weight:700;line-height:1.4;letter-spacing:-.14px;white-space:nowrap}
    .account-caret{flex-shrink:0}
    .sidebar-item-inner{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#fff;position:relative}
    .sidebar{grid-area:sidebar;background:var(--color-nav-bg);display:flex;flex-direction:column;gap:8px;padding-top:12px}
    .sidebar-item{display:flex;justify-content:center;padding:12px}
    .sidebar-item.is-active .sidebar-item-inner{background:rgba(255,255,255,.1)}
    .content{grid-area:content;background:#fff;padding:0 32px 24px;border-top-left-radius:20px;overflow-x:hidden;overflow-y:auto;min-height:0}
    .icon{font-family:'Material Symbols Rounded';font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 24;user-select:none;flex-shrink:0}
    .tg-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;height:40px;padding:0 16px;border-radius:12px;font:var(--text-md-bold);letter-spacing:-.01em;transition:background-color 100ms}
    .tg-button .icon{width:24px;height:24px;font-size:24px}
    .tg-button--icon{width:40px;padding:8px}
    .tg-button--primary{color:#00dbff;background:#002233}
    .tg-button--primary:hover:not(:disabled){color:#66e9ff;background:#003347}
    .tg-button--primary:disabled{color:#7f8d99;background:#edeff1;cursor:not-allowed}
    .tg-button--secondary{color:#0077b2;background:#b2f4ff}
    .tg-button--secondary:hover{color:#005580;background:#66ebff}
    .tg-button--tertiary{color:#0077b2;background:transparent}
    .tg-button--neutral{color:#405466;background:transparent}
    .tg-button--neutral:hover{color:#002233;background:#eceeef}
    .tg-field{display:flex;flex-direction:column;gap:8px;width:100%}
    .tg-field__label{display:flex;gap:4px;font:var(--text-md-bold)}
    .tg-field__req{color:#c20046}
    .tg-input{display:flex;align-items:center;gap:8px;height:40px;padding:8px 12px;border:1px solid #b2bcc1;border-radius:12px;background:#fff}
    .tg-input input,.tg-input select{flex:1;min-width:0;border:0;background:transparent;font:var(--text-md);outline:none}
    .tg-input.is-disabled{background:#edeff1;color:#7f8d99}
    .tg-switch{display:inline-flex;align-items:center;gap:12px;font:var(--text-md)}
    .tg-switch__track{width:48px;height:24px;border-radius:999px;background:#b2bcc1;position:relative}
    .tg-switch__track::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-xs)}
    .tg-switch.is-on .tg-switch__track{background:#00dbff}
    .tg-switch.is-on .tg-switch__track::after{transform:translateX(24px)}
    .tg-message{display:flex;border-radius:8px;border-left:8px solid #00dbff;overflow:hidden}
    .tg-message__body{display:flex;gap:16px;flex:1;padding:12px 16px;border:1px solid #d6dbde;border-left:0;border-radius:0 8px 8px 0}
    .tg-group{display:flex;gap:8px;justify-content:flex-end;flex-wrap:nowrap}
    .deal{position:relative;display:flex;flex-direction:column;min-height:100%}
    .deal-header{display:flex;flex-direction:column;gap:12px;padding:40px 0 0;margin-bottom:40px}
    .deal-header__main{display:flex;align-items:flex-start;gap:16px;flex-wrap:nowrap}
    .deal-header__title{flex:1;min-width:0;padding-top:2px;font:700 28px/1.3 var(--font);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .deal-tags{display:flex;flex-wrap:wrap;gap:8px;padding-left:56px}
    .deal-tag{display:inline-flex;align-items:center;height:24px;padding:4px 8px;border-radius:4px;background:#eceeef;font:900 12px/1.3 var(--font);letter-spacing:-.01em;text-transform:uppercase}
    .deal-tag--cyan{background:#00dbff}
    .funnel{display:flex;list-style:none;padding:0 0 24px;flex-wrap:nowrap;min-width:0}
    .funnel-step{flex:1 1 0;display:flex;align-items:stretch;height:32px;min-width:0;position:relative}
    .funnel-step:not(.is-first){margin-left:-6px}
    .funnel-step__info{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;padding:6px 8px;font:var(--text-sm)}
    .funnel-step__info strong{font:var(--text-sm-bold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .funnel-step__info span{white-space:nowrap}
    .funnel-step__nose,.funnel-step__tale{width:6px;height:32px;flex-shrink:0}
    .funnel-step__nose{clip-path:polygon(0 0,100% 50%,0 100%)}
    .funnel-step__tale{clip-path:polygon(100% 0,100% 100%,0 50%)}
    .funnel-step.is-first .funnel-step__info{border-radius:8px 0 0 8px}
    .funnel-step.is-last .funnel-step__info{border-radius:0 8px 8px 0}
    .funnel-step--past{z-index:2}
    .funnel-step--current{z-index:3}
    .funnel-step--next{z-index:1}
    .funnel-step--past .funnel-step__info,.funnel-step--past .funnel-step__nose,.funnel-step--past .funnel-step__tale{background:#b2f4ff}
    .funnel-step--current .funnel-step__info,.funnel-step--current .funnel-step__nose,.funnel-step--current .funnel-step__tale{background:#00dbff}
    .funnel-step--next .funnel-step__info,.funnel-step--next .funnel-step__nose,.funnel-step--next .funnel-step__tale{background:#eceeef}
    .deal-grid{display:grid;grid-template-columns:460px minmax(0,1fr);gap:24px;align-items:start}
    .deal-aside{display:flex;flex-direction:column;gap:16px}
    .deal-panel{background:#eceeef;border:1px solid #d6dbde;border-radius:8px;overflow:hidden}
    .deal-acc{border-bottom:1px solid #d6dbde}
    .deal-acc:last-child{border-bottom:0}
    .deal-acc__head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:24px 16px;text-align:left;background:#eceeef}
    .deal-acc__title{font-family:var(--font-crm);font-size:20px;font-weight:700;line-height:30px}
    .deal-tabs{display:flex;border-bottom:1px solid #d6dbde;overflow:auto}
    .deal-tab{padding:8px 16px 16px;font:var(--text-md-bold);color:#405466;white-space:nowrap;box-shadow:inset 0 -1px 0 #d6dbde}
    .deal-tab:first-child{padding-left:0}
    .deal-tab.is-active{color:#0077b2;box-shadow:inset 0 -4px 0 #00dbff}
    .deal-toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:32px;margin-bottom:24px}
    .deal-filters{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
    .deal-filter{display:flex;align-items:center;gap:12px;font-family:var(--font-crm);font-weight:700}
    .deal-filter .tg-input{min-width:168px}
    .timeline-item{display:grid;grid-template-columns:40px 1fr;gap:12px}
    .timeline-rail{display:flex;flex-direction:column;align-items:center;padding-top:4px}
    .timeline-dot{width:16px;height:16px;border-radius:50%;border:4px solid #6e00c5;background:#fff;flex-shrink:0}
    .timeline-flag{width:40px;height:40px;border-radius:50%;background:#e60f57;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .timeline-line{width:4px;flex:1;min-height:24px;background:#d6dbde;border-radius:999px}
    .timeline-content{padding-bottom:32px}
    .timeline-meta{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:8px}
    .pay-block{background:#eceeef;border-radius:8px;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
    .pay-block .deal-acc__head{padding:0 8px;justify-content:flex-start;gap:8px}
    .pay-block .deal-acc__title{flex:1}
    .pay-block .tg-button{align-self:flex-start}
    .pay-badge{display:inline-flex;align-items:center;justify-content:center;height:16px;min-width:21px;padding:0 8px;border-radius:999px;background:#e5e8ea;font:900 12px/1.3 var(--font)}
    .pay-empty{padding:0 10px;font-family:var(--font-crm)}
    .pay-list{display:flex;flex-direction:column;gap:16px}
    .pay-row{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:0 8px;flex-wrap:nowrap}
    .pay-row__open{min-width:0;text-align:left;flex-shrink:0}
    .pay-row__prefix{width:186px;flex-shrink:0;display:flex;flex-direction:column;font-family:var(--font-crm);font-size:16px;line-height:24px;white-space:nowrap}
    .pay-pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:4px 8px;border-radius:999px;background:#b2f4ff;color:#002233;font:var(--text-xs);white-space:nowrap;flex-shrink:0}
    .pay-pill .icon{font-size:16px;width:16px;height:16px}
    .pay-pill--inativo{background:#e5e8ea}
    .pay-pill--concluido{background:#d6fae8}
    .drawer-scrim{position:fixed;inset:0;background:rgba(0,34,51,.4);z-index:9700}
    .drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,100%);background:#fff;box-shadow:var(--shadow-md);z-index:9800;display:flex;flex-direction:column}
    .drawer-header{display:flex;gap:24px;padding:24px;border-bottom:1px solid #d6dbde}
    .drawer-header h2{flex:1;padding-top:4px;font:var(--text-lg-bold)}
    .drawer-body{flex:1;min-height:0;overflow:hidden;padding:8px 12px;display:flex;flex-direction:column}
    .drawer-form{display:flex;flex-direction:column;gap:24px;padding:24px 12px;flex:1 1 0;min-height:0;overflow:auto}
    .drawer-actions{display:flex;justify-content:flex-end;padding:24px;border-top:1px solid #d6dbde}
    .total-card{flex:0 0 auto;width:100%;display:flex;flex-direction:column;margin-top:8px;padding:12px 24px;border:1px solid #b2bcc1;border-radius:16px;background:#fff;text-align:left;position:relative;z-index:0}
    .total-card.is-open{max-height:180px;overflow:auto}
    .total-card__head{display:flex;align-items:center;gap:8px;padding:8px 0}
    .total-card__head strong{flex:1;min-width:0;font:var(--text-lg-bold)}
    .total-card__amount{flex:0 0 auto;margin-left:auto;font:var(--text-lg);text-align:right}
    .chevron{display:block;width:24px;height:24px;flex-shrink:0;position:relative;color:#002233}
    .chevron::before{content:'';position:absolute;top:50%;left:50%;width:8px;height:8px;margin:-6px 0 0 -6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
    .chevron.is-up::before{margin-top:-2px;transform:rotate(-135deg)}
    .total-card__body{display:flex;flex-direction:column;gap:8px}
    .total-card__divider{display:block;height:1px;margin:4px 0;background:#d6dbde}
    .total-card__items{display:flex;flex-direction:column;gap:8px;list-style:none}
    .total-card__items li{display:flex;gap:22px;font-family:var(--font-crm);font-size:16px;line-height:24px;color:#212429}
    .total-card__items li span:first-child{flex:1}
    .total-card__items li span:last-child{flex:1;text-align:right}
    .items-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #d6dbde}
    .item-card{display:flex;gap:8px;padding:24px 16px 24px 32px;border:1px solid #d6dbde;border-radius:16px;margin-top:12px}
    .item-card__fields{flex:1;display:flex;flex-direction:column;gap:22px}
    .item-card__row{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .ready-stack{display:flex;flex-direction:column;gap:16px;padding:24px 12px}
    .ready-card{display:flex;flex-direction:column;gap:8px;padding:24px;border:1px solid #d6dbde;border-radius:16px}
    .ready-title{display:flex;align-items:center;gap:8px;font:var(--text-lg-bold)}
    .ready-title .icon{color:#087a3a}
    .ready-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .ready-link{display:flex;gap:16px;align-items:flex-end}
    .ready-items{display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px solid #d6dbde}
    .ready-item{display:flex;justify-content:space-between;gap:16px}
    .toast{position:absolute;top:16px;right:16px;z-index:50;width:min(320px,calc(100% - 32px));display:flex;align-items:flex-start;gap:8px;padding:8px;background:#fff;border-radius:8px;border-left:8px solid #0ed869;box-shadow:var(--shadow-md);overflow:visible}
    .toast__icon{display:flex;padding-top:4px;color:#087a3a}
    .toast__content{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:4px 0}
    .toast__title{font:var(--text-md-bold)}
    .toast__description{font:var(--text-sm);white-space:normal;overflow-wrap:anywhere}
    .checkout{flex:1;min-height:0;height:auto;background:#fff;color:#252525;font-family:Inter,'DM Sans',sans-serif}
    .checkout-header{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px;background:#fff;border-bottom:1px solid #ebebeb;box-shadow:0 1px 2px rgba(0,0,0,.05);position:sticky;top:0;z-index:5}
    .checkout-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#252525}
    .checkout-back:hover{background:#f3f3f3}
    .checkout-logo{display:flex;color:#111}
    .checkout-main{width:min(1440px,calc(100% - 48px));margin:0 auto;padding:76px 0 80px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.9fr);gap:64px;align-items:start}
    .checkout-col{display:flex;flex-direction:column;gap:24px;min-width:0}
    .ck-panel,.checkout-order,.ck-card-box,.ck-info-box,.ck-success-card{background:#fafafa;border:1px solid rgba(0,0,0,.04);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
    .ck-panel{padding:24px}
    .checkout-title{font-size:20px;font-weight:600;line-height:28px;margin:0 0 24px}
    .checkout-section+.checkout-section{margin-top:16px}
    .checkout-section h3{font-size:16px;font-weight:600;margin-bottom:16px}
    .checkout-fields{display:flex;flex-direction:column;gap:16px}
    .checkout-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

const STATUS={

  concluido:{label:'Pagamento concluído',icon:'check_circle'}
};
const PREV=['concluido','inativo'];
const fmt=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtTotal=c=>c?fmt(c):'R$ 00,00';
const parse=v=>Number.parseInt((v||'').replace(/\D/g,''),10)||0;
const fmtIn=c=>c?(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const fmtDt=d=>d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const uid=()=>crypto.randomUUID();
const DEMO_CHECKOUT={id:'demo-checkout',name:'Camiseta Universo TOTVS',description:'Pedido demonstração TOTVS Pay',total:14990,items:[{id:'demo-item',name:'Camiseta Universo TOTVS',unit:14990,qty:1}]};
const state={links:[],drawer:'closed',active:null,toast:null,pendingSuccess:false,totalOpen:false,draft:emptyDraft(),tab:'Histórico',view:'deal',checkout:null,checkoutStep:'identify',ident:emptyIdent(),authed:false,loginError:'',loginUser:'',loginPass:'',checkoutDemo:false};
const USERS=new Set(['nic','nat','poli','gui','bruno','lu','triz','ze','piloto','ana']);
function normUser(v){return (v||'').trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu,'')}
function isValidLogin(u,p){const n=normUser(u);if(n==='piloto')return p==='totvspay2809';return USERS.has(n)&&p==='123'}
let toastTimer;
function emptyDraft(){return{name:DEAL.name,description:'',total:0,specify:false,items:[{id:uid(),name:'',unit:0,qty:1}]}}

function total(){return state.draft.specify?state.draft.items.reduce((s,i)=>s+i.unit*i.qty,0):state.draft.total}
function canCreate(){const d=state.draft;if(!d.name.trim()||!d.description.trim())return false;if(!d.specify)return d.total>0;return d.items.every(i=>i.name.trim()&&i.unit>0&&i.qty>0)}

function pill(status,id,toCheckout){const meta=STATUS[status];const cls=`pay-pill pay-pill--${status}`;const body=`${icon(meta.icon,16)}${meta.label}`;if(status==='ativo'&&id) return `<button type="button" class="${cls}" data-act="${toCheckout?'open-checkout':'copy-link'}" data-id="${id}">${body}</button>`;return `<span class="${cls}">${body}</span>`}

function backIco(){return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18 9 12l6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function orderHTML(link){
  const items=link.items.map((i,idx)=>{
    const desc=i.description||(idx===0&&link.description&&link.description!==i.name?link.description:'');
    return `<div class="checkout-item"><div class="checkout-item__row"><p>${i.name}</p><p>${fmt(i.unit*i.qty)}</p></div>${desc?`<p class="checkout-item__desc">${desc}</p>`:''}<p class="checkout-item__qty">Quantidade: ${i.qty}</p></div>`;
  }).join('');
  return `<aside class="checkout-order"><h2>Pedido</h2><div class="checkout-order__items">${items}</div><div class="checkout-order__total"><span>Total</span><span>${fmt(link.total)}</span></div></aside>`;

function qrHTML(){
  let cells='';
  for(let y=0;y<25;y++) for(let x=0;x<25;x++){
    const finder=(ox,oy)=>{const dx=x-ox,dy=y-oy; if(dx<0||dy<0||dx>6||dy>6) return null; if(dx===0||dy===0||dx===6||dy===6) return true; if(dx>=2&&dx<=4&&dy>=2&&dy<=4) return true; return false};
    const on=finder(0,0)??finder(18,0)??finder(0,18)??((x*7+y*13+x*y)%5===0);
    if(on) cells+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg class="ck-qr" viewBox="0 0 25 25" aria-hidden="true">${cells}</svg>`;
}

function syncCheckout(){
  const btn=document.querySelector('[data-act="continue-ident"]');
  if(!btn) return;
  const ids=['ck-name','ck-email','ck-phone','ck-doc','ck-cep','ck-street','ck-number','ck-district','ck-city','ck-uf'];
  const ready=()=>ids.every(id=>{const el=document.getElementById(id);return el&&String(el.value||'').trim()});
  const paint=()=>{captureIdent();btn.disabled=!ready()};
  ids.forEach(id=>{const el=document.getElementById(id);if(!el)return;el.oninput=paint;el.onchange=paint});
  btn.disabled=!ready();
}
function setChrome(mode){
  const root=document.getElementById('crm-root');
  const loginNav=document.getElementById('login-nav');
  const crmNav=document.getElementById('crm-nav');
  if(!root||!loginNav||!crmNav) return;
  root.classList.toggle('is-login',mode==='login'||mode==='suri');
  root.classList.toggle('is-suri',mode==='suri');
  if(mode==='crm'){loginNav.hidden=true;crmNav.hidden=false}
  else{loginNav.hidden=false;crmNav.hidden=true}
}

  const funnel=[{label:'Entrada',tone:'past'},{label:'Qualificação',tone:'past'},{label:'Propostas',tone:'past'},{label:'Ajustes',tone:'past'},{label:'Negociação',tone:'current'},{label:'Documentação',tone:'next'}].map((step,i)=>`<li class="funnel-step funnel-step--${step.tone}${i===0?' is-first':''}${i===5?' is-last':''}">${i>0?'<span class="funnel-step__tale"></span>':''}<span class="funnel-step__info"><strong>${step.label}</strong> <span>(0 dias)</span></span>${i<5?'<span class="funnel-step__nose"></span>':''}</li>`).join('');
  const tabs=['Histórico','Email','Tarefas','Questionário','Produtos e serviços','Proposta','Arquivos'];
  const items=d.specify?`<section><div class="items-head"><h3>Produtos e serviços do link</h3>${btn('tertiary','Adicionar novo item',{icon:'add',act:'add-item'})}</div>${d.items.map(i=>`<article class="item-card"><div class="item-card__fields">${field('Nome','n-'+i.id,i.name,{req:true,ph:'Insira o nome do item'})}<div class="item-card__row">${field('Preço unitário','p-'+i.id,fmtIn(i.unit),{req:true,prefix:'R$',ph:'00,00'})}<label class="tg-field"><span class="tg-field__label">Quantidade<span class="tg-field__req">*</span></span><span class="tg-input"><select id="q-${i.id}">${Array.from({length:20},(_,k)=>`<option ${i.qty===k+1?'selected':''}>${k+1}</option>`).join('')}</select></span></label></div></div>${btn('neutral','',{icon:'delete',iconOnly:true,act:'del-item',id:i.id,disabled:d.items.length===1,aria:'Excluir item'})}</article>`).join('')}</section>`:'';
  const breakdown=d.specify?d.items.filter(i=>i.name.trim()||i.unit>0): (t>0||d.description.trim()?[{id:'simple',name:d.description.trim()||'Valor do link',qty:1,unit:t}]:[]);
  const totalBody=state.totalOpen?`<div class="total-card__body"><span class="total-card__divider"></span>${breakdown.length?`<ul class="total-card__items">${breakdown.map(i=>`<li><span>${i.name||'Item sem nome'}</span><span>${i.qty}x ${fmt(i.unit)}</span></li>`).join('')}</ul>`:''}</div>`:'';
  const create=`<div class="drawer-body"><div class="drawer-form">${field('Nome','name',d.name,{req:true})}${field('Descrição','desc',d.description,{req:true,ph:'Insira a descrição do pagamento'})}<div>${field('Valor total','val',d.specify?fmtIn(t):fmtIn(d.total),{req:true,prefix:d.specify?'':'R$',ph:d.specify?'Cadastre os itens para obter a soma total':'00,00',disabled:d.specify})}<div style="margin-top:24px"><button class="tg-switch${d.specify?' is-on':''}" data-act="toggle" role="switch"><span class="tg-switch__track"></span>Especificar itens</button></div></div>${items}</div><button type="button" class="total-card${state.totalOpen?' is-open':''}" data-act="toggle-total" aria-expanded="${state.totalOpen}"><div class="total-card__head"><strong>Total</strong><span class="total-card__amount">${fmtTotal(t)}</span>${chevron(!state.totalOpen)}</div>${totalBody}</button></div><footer class="drawer-actions"><div class="tg-group">${btn('secondary','Cancelar',{act:'close'})}${btn('primary','Criar link',{act:'create',disabled:!canCreate()})}</div></footer>`;
  const a=state.active;
  const ready=a?`<div class="drawer-body"><div class="ready-stack"><aside class="tg-message"><div class="tg-message__body">${icon('info')}<div><p class="tg-message__title">Configurações de pagamento</p><p>Métodos de pagamento aceitos, validade do link e número de parcelas são determinados por Administradores na TOTVSPay.</p></div></div></aside><section class="ready-card"><h3 class="ready-title">${icon('check_circle')} Link de pagamento pronto!</h3><div><strong>Nome</strong><p>${a.name}</p></div><div><strong>Descrição</strong><p style="color:#405466">${a.description}</p></div><div class="ready-grid"><div><strong>Valor total</strong><p>${fmt(a.total)}</p></div><div><strong>Data de criação</strong><p>${a.created.toLocaleDateString('pt-BR')}</p></div><div><strong>Data de expiração</strong><p>${a.expires.toLocaleDateString('pt-BR')}</p></div></div><div class="ready-link">${field('Link','url',a.url,{disabled:true})}${btn('secondary','',{icon:'content_copy',iconOnly:true,act:'copy',aria:'Copiar link'})}</div><div class="ready-items"><strong>Itens no link</strong>${a.items.map(i=>`<div class="ready-item"><span>${i.name}</span><span>${i.qty}x ${fmt(i.unit)}</span></div>`).join('')}</div></section></div></div><footer class="drawer-actions"><div class="tg-group">${btn('secondary','Fechar',{act:'close'})}${btn('primary','Copiar link',{act:'copy'})}</div></footer>`:'';
  const drawer=state.drawer==='closed'?'':`<button class="drawer-scrim" data-act="close" aria-label="Fechar"></button><aside class="drawer" role="dialog">${`<header class="drawer-header"><h2>Link de pagamento</h2>${btn('neutral','',{icon:'close',iconOnly:true,act:'close',aria:'Fechar'})}</header>`}${state.drawer==='create'?create:ready}</aside>`;
  const toast=state.toast&&state.drawer==='closed'?`<div class="toast" role="status"><span class="toast__icon">${icon('check_circle')}</span><div class="toast__content"><p class="toast__title">${state.toast.title}</p>${state.toast.description?`<p class="toast__description">${state.toast.description}</p>`:''}</div>${btn('neutral','',{icon:'close',iconOnly:true,act:'dismiss-toast',aria:'Fechar aviso'})}</div>`:'';
  document.getElementById('app').innerHTML=`
    <div class="deal">
      <header class="deal-header">
        <div class="deal-header__main">${btn('neutral','',{icon:'arrow_back',iconOnly:true,aria:'Voltar'})}<h1 class="deal-header__title">${DEAL.name}</h1><div class="tg-group">${btn('neutral','',{icon:'more_vert',iconOnly:true,aria:'Mais ações'})}${btn('secondary','Marcar perda',{icon:'thumb_down'})}${btn('primary','Marcar venda',{icon:'thumb_up'})}</div></div>
        <div class="deal-tags"><span class="deal-tag deal-tag--cyan">EM ANDAMENTO</span><span class="deal-tag">FECHAMENTO E FEEDBACK</span><span class="deal-tag deal-tag--cyan">VENDA CERTA!</span></div>
      </header>
      <ol class="funnel">${funnel}</ol>
      <div class="deal-grid">
        <div class="deal-aside">
          <aside class="deal-panel">
            ${['Negociação','Contatos','Empresa','Responsável'].map(n=>`<section class="deal-acc"><div class="deal-acc__head"><span class="deal-acc__title">${n}</span>${icon('expand_more')}</div></section>`).join('')}
          </aside>
          <section class="pay-block"><div class="deal-acc__head"><h2 class="deal-acc__title">Pagamentos</h2>${links.length?`<span class="pay-badge">${links.length}</span>`:''}${icon('expand_less')}</div>${payBody}${btn('secondary','Criar link de pagamento',{icon:'add',act:'open-create'})}${links.length?btn('tertiary','Ver histórico de pagamentos',{act:'history'}):''}</section>
        </div>
        <section>
          <div class="deal-tabs">${tabs.map(n=>`<button class="deal-tab${state.tab===n?' is-active':''}" data-tab="${n}">${n}</button>`).join('')}</div>
          <div class="deal-toolbar"><div class="deal-filters"><label class="deal-filter">Do<span class="tg-input"><select><option>RD Station CRM</option></select></span></label><label class="deal-filter">Exibir<span class="tg-input"><select><option>Todos os eventos</option></select></span></label></div>${btn('secondary','Criar anotação',{icon:'add'})}</div>
          <div>${hist.map((e,i)=>`<article class="timeline-item"><div class="timeline-rail">${e.kind==='flag'?`<span class="timeline-flag">${icon('flag',24)}</span>`:'<span class="timeline-dot"></span>'}${i<hist.length-1?'<span class="timeline-line"></span>':''}</div><div class="timeline-content"><p>${e.html}</p><div class="timeline-meta"><time>${e.at}</time>${e.status?pill(e.status,e.id):''}</div></div></article>`).join('')}</div>
        </section>
      </div>
      ${toast}
    </div>`;
  document.getElementById('overlay-root').innerHTML=drawer;
  bind();
}
function bind(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    if(el.dataset.act==='toggle-products') return;
    el.onclick=ev=>{ev.stopPropagation();act(el.dataset.act,el.dataset.id)};
  });
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render()});
  const name=document.getElementById('name'); if(name) name.oninput=e=>{state.draft.name=e.target.value;refreshCreate()};
  const desc=document.getElementById('desc'); if(desc) desc.oninput=e=>{state.draft.description=e.target.value;refreshCreate()};
  const val=document.getElementById('val'); if(val&&!state.draft.specify) val.oninput=e=>{const digits=(e.target.value||'').replace(/\D/g,'');state.draft.total=digits?Number.parseInt(digits,10):0;e.target.value=fmtIn(state.draft.total);refreshCreate()};
  state.draft.items.forEach(i=>{
    const n=document.getElementById('n-'+i.id); if(n) n.oninput=e=>{i.name=e.target.value;refreshCreate()};
    const p=document.getElementById('p-'+i.id); if(p) p.oninput=e=>{const digits=(e.target.value||'').replace(/\D/g,'');i.unit=digits?Number.parseInt(digits,10):0;e.target.value=fmtIn(i.unit);refreshCreate()};
    const q=document.getElementById('q-'+i.id); if(q) q.onchange=e=>{i.qty=Number(e.target.value);render()};
  });
}
function refreshCreate(){
  const b=document.querySelector('[data-act="create"]'); if(b) b.disabled=!canCreate();
  const totalEl=document.querySelector('.total-card__amount'); if(totalEl) totalEl.textContent=fmtTotal(total());
}
function copyLink(url){
  if(!url) return;
  navigator.clipboard.writeText(url).catch(()=>{});
  showToast({title:'Link copiado',description:'O link de pagamento está na área de transferência'});
  render();
}
function act(a,id){
  if(a==='login'){
    const u=state.loginUser||'';
    const p=state.loginPass||'';
    if(!u.trim()||!p) return;
    if(!isValidLogin(u,p)){state.loginError='Usuário ou senha inválidos';render();return}
    state.authed=true;state.loginError='';render();return;
  }
  if(a==='open-create'){state.draft=emptyDraft();state.totalOpen=false;state.drawer='create';state.active=null;render()}
  if(a==='close'){
    state.drawer='closed';
    if(state.pendingSuccess){
      state.pendingSuccess=false;
      showToast({title:'Link criado com sucesso',description:'A partir de agora você já consegue receber pagamentos através desse link'});
    }
    render();
  }
  if(a==='toggle'){state.draft.specify=!state.draft.specify;render()}
  if(a==='toggle-total'){state.totalOpen=!state.totalOpen;render()}
  if(a==='add-item'){state.draft.items.push({id:uid(),name:'',unit:0,qty:1});render()}
  if(a==='del-item'&&state.draft.items.length>1){state.draft.items=state.draft.items.filter(i=>i.id!==id);render()}
  if(a==='history'){state.tab='Histórico';render()}
  if(a==='dismiss-toast'){clearTimeout(toastTimer);state.toast=null;render()}
  if(a==='create'&&canCreate()){
    const now=new Date(); const t=total();
    const items=state.draft.specify?state.draft.items.map(i=>({...i})):[{id:uid(),name:state.draft.description,unit:t,qty:1}];
    const link={id:uid(),name:state.draft.name,description:state.draft.description,total:t,items,url:'https://link.malga.io/'+uid(),created:now,expires:new Date(now.getTime()+31*86400000),status:'ativo'};
    state.links=state.links.map((l,i)=>({...l,status:PREV[i%PREV.length]}));
    state.links.unshift(link);
    state.active=link;
    state.drawer='ready';
    state.pendingSuccess=true;
    render();
  }
  if(a==='open'){state.active=state.links.find(l=>l.id===id);state.drawer='ready';render()}
  if(a==='open-checkout'){const l=state.links.find(x=>x.id===id); if(!l) return; state.checkoutDemo=false; state.checkout=l; state.view='checkout'; state.checkoutStep='identify'; state.ident=emptyIdent(); state.drawer='closed'; state.pendingSuccess=false; render()}
  if(a==='continue-ident'){captureIdent(); state.checkoutStep='method'; render()}
  if(a==='edit-ident'){state.checkoutStep='identify'; render()}
  if(a==='other-method'){state.checkoutStep='method'; render()}
  if(a==='pay-card'){state.checkoutStep='card'; render()}
  if(a==='pay-pix'){state.checkoutStep='pix'; render()}
  if(a==='pay-boleto'){state.checkoutStep='boleto'; render()}
  if(a==='pix-success'){state.checkoutStep='pix-success'; render()}
  if(a==='boleto-success'){state.checkoutStep='boleto-success'; render()}
  if(a==='card-success'){state.checkoutStep='card-success'; render()}
  if(a==='copy-pix'||a==='copy-boleto'){const ta=document.querySelector('#checkout-root textarea'); if(ta) navigator.clipboard.writeText(ta.value).catch(()=>{});}
  if(a==='back-pay'&&state.checkout){
    if(state.checkoutDemo){
      state.checkout=null; state.checkoutDemo=false; state.view='deal';
      if(location.hash==='#checkout') history.replaceState(null,'','#deal');
      render();return;
    }
    const id=state.checkout.id;
    state.links=state.links.map(l=>l.id===id?{...l,paid:true,status:'concluido',paidAt:new Date()}:l);
    state.checkout=null; state.view='deal'; state.tab='Histórico';
    showToast({title:'Pagamento confirmado',description:'O link saiu da lista lateral e o pagamento consta no histórico'});
    render();
  }
  if(a==='copy'&&state.active){copyLink(state.active.url)}
  if(a==='copy-link'){const l=state.links.find(x=>x.id===id); if(l) copyLink(l.url)}
}
window.__pdNavigate=function(id){
  if(id==='totvs'||id==='totvs-credenciamento'||id==='totvs-dashboard'||id==='construcao'){
    const p=location.pathname;
    const i=p.search(new RegExp('/(totvs|construcao)(?:/|$)'));
    const root=i>=0?p.slice(0,i)+'/': (p.endsWith('/')?p:p.replace(/[^/]+$/,''));
    if(id==='construcao'){location.assign(root+'construcao/');return}
    try{sessionStorage.setItem('totvs-onboarded',id==='totvs-dashboard'?'1':'0')}catch(e){}
    location.assign(root+(id==='totvs-dashboard'?'totvs/dashboard':'totvs/'));
    return;
  }
  if(id==='suri'){state.view='suri';state.checkout=null;state.checkoutDemo=false;history.replaceState(null,'','#suri');render();return}
  if(id==='checkout'){openDemoCheckout();history.replaceState(null,'','#checkout');render();return}
  if(id==='rd'){state.view='deal';state.checkout=null;state.checkoutDemo=false;history.replaceState(null,'','#deal');render()}
};
window.addEventListener('hashchange',()=>{
  const h=location.hash.slice(1);
  if(h==='suri'){state.view='suri';state.checkout=null;render()}
  else if(h==='checkout'){openDemoCheckout();render()}
  else if(h==='deal'||h===''){state.view='deal';if(state.checkoutDemo){state.checkout=null;state.checkoutDemo=false}render()}
});
(function(){
  const h=location.hash.slice(1);
  if(h==='suri') state.view='suri';
  if(h==='checkout') openDemoCheckout();
})();
render();
</script>
</body>
</html>
