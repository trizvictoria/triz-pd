<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecionando</title>
    <script>
      sessionStorage.setItem('spa-path', location.pathname + location.search + location.hash)
      var path = location.pathname
      var base = path.indexOf('/triz-pd/') === 0 ? '/triz-pd/' : '/'
      var totvs = path.indexOf('/totvs') !== -1
      location.replace(totvs ? base + 'totvs/' : base)
    </script>
  </head>
  <body></body>
</html>
